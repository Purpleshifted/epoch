version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

  web-mobile:
    build:
      context: .
      dockerfile: apps/web-mobile/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_SOCKET_URL=http://localhost:3000
    depends_on:
      - server

  web-display:
    build:
      context: .
      dockerfile: apps/web-display/Dockerfile
    ports:
      - "5174:5174"
    environment:
      - VITE_SOCKET_URL=http://localhost:3000
    depends_on:
      - server
